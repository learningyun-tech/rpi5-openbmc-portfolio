# Generated build policy for the Raspberry Pi 5 OpenBMC laboratory image.
# scripts/build.sh copies this file into the Yocto build directory.

MACHINE = "raspberrypi5"
DISTRO = "openbmc-phosphor"
PACKAGE_CLASSES = "package_ipk"

# Mark this as an evaluation board: no managed host is physically attached.
require conf/machine/include/obmc-evb-common.inc

EXTRA_IMAGE_FEATURES = "allow-root-login"
USER_CLASSES = "buildstats"
PATCHRESOLVE = "noop"
CONF_VERSION = "2"

# Pi 5 direct firmware boot requires an uncompressed arm64 Image.
KERNEL_IMAGETYPE = "Image"
KERNEL_IMAGETYPES = "Image"

# Build only artifacts useful for an SD card, not BMC NOR/MTD formats.
IMAGE_FSTYPES = "wic.bz2 wic.bmap"
IMAGE_ROOTFS_EXTRA_SPACE = "524288"

# Useful embedded-development buses and the Pi 5 UART debug console.
ENABLE_I2C = "1"
ENABLE_SPI_BUS = "1"
ENABLE_UART = "1"

# This is a headless management appliance image.
DISABLE_VC4GRAPHICS = "1"
MACHINE_FEATURES:remove = "screen touchscreen alsa"

# Make the DHCP lease recognizable in a router's client table.
hostname:pn-base-files = "rpi5-openbmc"

# Keep downloads and shared state outside tmp so incremental rebuilds survive.
DL_DIR = "${TOPDIR}/../downloads"
SSTATE_DIR = "${TOPDIR}/../sstate-cache"

BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},5G,100K \
    STOPTASKS,${DL_DIR},5G,100K \
    STOPTASKS,${SSTATE_DIR},5G,100K \
    STOPTASKS,/tmp,1G,100K \
    HALT,${TMPDIR},1G,1K \
    HALT,${DL_DIR},1G,1K \
    HALT,${SSTATE_DIR},1G,1K \
    HALT,/tmp,100M,1K"

# Local experiments belong here; build.sh creates the file if absent.
include conf/local-extra.conf
DISTRO_FEATURES:append = " phosphor-no-ipmi-rmcp"
INHERIT += "distrooverrides"
DISTRO_FEATURES_OVERRIDES += "phosphor-no-ipmi-rmcp"
